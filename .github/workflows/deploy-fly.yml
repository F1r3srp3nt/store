# Deploys the HCG Store server (storefront + sign-in) to Fly.io. Manual only: Actions → "Deploy Store
# server to Fly.io" → Run workflow. Needs the repository secret FLY_API_TOKEN: an org-scoped token
# (`fly tokens create org`) for the first run, which also creates the app, its volume and its session
# key; an app deploy token (`fly tokens create deploy -a hcg-store`) is enough afterwards.
#
# mode=deploy: create what is missing (idempotent), deploy, request the certificate for the domain, smoke-test.
# mode=status: change nothing; report machines, certificate and DNS state, and both addresses' health.
# mode=evidence: change nothing; print the sign-in audit trail since `since_ms` WITHOUT account IDs, tokens or
#   cookies (this repository's Actions logs are public): event types, times, reasons, session references.
# mode=restart: restart the Machine (session-restoration check); the database and sessions persist on the volume.
#
# The session key is generated inside the runner and piped straight to Fly; it is never printed or stored here.
# Payments, purchase grants, publishing and protected downloads stay off: fly.toml sets them, and the server
# refuses unsafe production settings at start.
name: Deploy Store server to Fly.io

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy, or status (read-only)"
        required: true
        default: deploy
        type: choice
        options: [deploy, status, evidence, restart, profile, import-release, free-window, release-exception]
      org:
        description: "Fly.io organisation for a new app (personal = your own)"
        required: true
        default: personal
      check_url:
        description: "Address to smoke-test after deploying"
        required: true
        default: "https://hcg-store.fly.dev/"
      since_ms:
        description: "evidence: only events at or after this time (ms since 1970)"
        required: false
        default: "0"
      session_ref:
        description: "profile: 12-hex reference of a sign-in the Store verified and matched with HCG's /me (from mode=evidence)"
        required: false
        default: ""
      display_name:
        description: "profile: Store display name (presentation only; grants nothing)"
        required: false
        default: ""
      designation:
        description: "profile: Store designation, e.g. Founder / Original User (presentation only; grants nothing)"
        required: false
        default: ""
      authorised_by:
        description: "profile: who authorised this change (recorded in the append-only profile audit)"
        required: false
        default: ""
      operator_args:
        description: 'import-release: {"request":"<file in release-imports/>","authorised_by":"…","preserved_run":"<optional release-import run ID>"} · free-window: {"command":"open|extend|terminate|list","product":"…","edition":"…","release":"rel-…","starts":"now|ISO|publication","ends":"ISO","days":"30","id":"fw-…","reason":"…","authorised_by":"…"} · release-exception: {"command":"grant|revoke|list","release":"rel-…","session_ref":"<12 hex>","digest":"<optional files digest>","id":"rx-…","reason":"…","authorised_by":"…"}'
        required: false
        default: "{}"

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # import-release with preserved_run downloads this repository's own verified copy of the files.
  actions: read

env:
  DOMAIN: store.hakmicapitalgroup.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: web-hcg-store
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: App name from fly.toml
        run: echo "APP=$(sed -n 's/^app = "\(.*\)"$/\1/p' fly.toml)" >> "$GITHUB_ENV"
      - name: Fly access
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::The repository secret FLY_API_TOKEN is not set."; exit 1; fi
          flyctl auth whoami >/dev/null 2>&1 || flyctl orgs list >/dev/null || { echo "::error::FLY_API_TOKEN was refused by Fly.io."; exit 1; }
          echo "Fly.io accepted the token."

      - uses: actions/setup-node@v4
        if: inputs.mode == 'deploy'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-hcg-store/package-lock.json
      - if: inputs.mode == 'deploy'
        run: npm ci
      - name: Unit, component and server tests
        if: inputs.mode == 'deploy'
        run: npm test

      - name: Create the app if missing
        if: inputs.mode == 'deploy'
        run: |
          if flyctl status --app "$APP" >/dev/null 2>&1; then echo "App $APP exists."; else
            flyctl apps create "$APP" --org "${{ inputs.org }}" --yes \
              || { echo "::error::Could not create app $APP (the name may be taken by another Fly.io account; change app in fly.toml)."; exit 1; }
          fi
      - name: Create the data volume if missing
        if: inputs.mode == 'deploy'
        run: |
          vols=$(flyctl volumes list --app "$APP" --json)
          if echo "$vols" | grep -q '"hcg_store_data"'; then echo "Volume hcg_store_data exists."; else
            flyctl volumes create hcg_store_data --app "$APP" --region arn --size 3 --snapshot-retention 14 --yes
          fi
      - name: Create the session key if missing (never printed)
        if: inputs.mode == 'deploy'
        run: |
          names=$(flyctl secrets list --app "$APP" --json) || { echo "::error::Could not list secrets; not creating a new key."; exit 1; }
          if echo "$names" | grep -q '"HCG_STORE_SECRET_KEY"'; then
            echo "HCG_STORE_SECRET_KEY is set; not changed."
          else
            printf 'HCG_STORE_SECRET_KEY=%s\n' "$(openssl rand -base64 32)" | flyctl secrets import --app "$APP" --stage >/dev/null
            echo "HCG_STORE_SECRET_KEY created."
          fi
      - name: Deploy (one Machine, built by Fly's remote builder from web-hcg-store/Dockerfile)
        if: inputs.mode == 'deploy'
        run: flyctl deploy --app "$APP" --remote-only --ha=false --yes --build-arg GITHUB_SHA=${{ github.sha }}
      - name: Request the certificate for the domain
        if: inputs.mode == 'deploy'
        run: flyctl certs show "$DOMAIN" --app "$APP" >/dev/null 2>&1 || flyctl certs add "$DOMAIN" --app "$APP"
      - name: Smoke-test the deployed server (commit, routes, HTTPS, redirect, no private files)
        if: inputs.mode == 'deploy'
        run: node scripts/smoke-deployment.mjs "${{ inputs.check_url }}" --expect-commit "${{ github.sha }}" --wait 300

      - name: Smoke-test the public domain (status mode, once DNS points to Fly)
        if: inputs.mode == 'status'
        continue-on-error: true
        run: |
          echo "Response headers from https://$DOMAIN/api/v1/health:"
          curl -sS -m 20 -D - -o /dev/null "https://$DOMAIN/api/v1/health" | grep -iE '^HTTP|^server|^fly-request-id|^strict-transport' || true
          node scripts/smoke-deployment.mjs "https://$DOMAIN/" --expect-commit "$(curl -s -m 15 https://$APP.fly.dev/hcg-build.json | jq -r .commit)"
      - name: Compare what each host serves (custom domain, Fly hostname, GitHub Pages IPs)
        if: inputs.mode == 'status'
        continue-on-error: true
        run: |
          {
          echo "## Host comparison"
          echo '```'
          probe() { # label, url, extra curl args
            local label="$1" url="$2"; shift 2
            for p in /api/v1/health /api/v1/session "/auth/login?return_to=/account" /hcg-build.json /account; do
              out=$(curl -sS -m 20 -o /tmp/body -D /tmp/hdr -w '%{http_code}' "$@" "$url$p" 2>&1 || true)
              ctype=$(grep -i '^content-type:' /tmp/hdr | head -1 | tr -d '\r' | cut -d' ' -f2-)
              srv=$(grep -iE '^server:' /tmp/hdr | head -1 | tr -d '\r' | cut -d' ' -f2-)
              cache=$(grep -iE '^cache-control:' /tmp/hdr | head -1 | tr -d '\r' | cut -d' ' -f2-)
              loc=$(grep -i '^location:' /tmp/hdr | head -1 | tr -d '\r' | sed -E 's/(state|nonce|code_challenge)=[^&]+/\1=…/g' | cut -c1-200)
              body=$(head -c 400 /tmp/body | tr '\n' ' ')
              case "$p" in
                /hcg-build.json) body=$(jq -c '{deployEnv,hostingTarget,accountService,commit}' /tmp/body 2>/dev/null || echo "$body" | cut -c1-80);;
                /account) body=$(grep -o '<script[^>]*src="[^"]*"' /tmp/body | head -1);;
                *) case "$ctype" in application/json*) ;; *) body="(not JSON) $(echo "$body" | cut -c1-60)";; esac;;
              esac
              printf '%-18s %-30s %s | %s | server=%s | cache=%s | %s %s\n' "$label" "$p" "$out" "$ctype" "$srv" "$cache" "$loc" "$body"
            done
          }
          probe "custom-domain" "https://$DOMAIN"
          probe "fly-hostname" "https://$APP.fly.dev"
          probe "github-pages-ip" "https://$DOMAIN" --resolve "$DOMAIN:443:185.199.108.153"
          echo
          echo "TTL of the store record at the authoritative server:"
          dig @ns1.dnsdomene.net +norecurse +noall +answer "$DOMAIN" CNAME
          echo "Zone default (SOA minimum / negative-cache TTL):"
          dig @ns1.dnsdomene.net +norecurse +noall +answer hakmicapitalgroup.com SOA
          echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Set a Store profile (presentation only; grants nothing; recorded with who authorised and performed it)
        if: inputs.mode == 'profile'
        env:
          REF: ${{ inputs.session_ref }}
          DN: ${{ inputs.display_name }}
          DS: ${{ inputs.designation }}
          AB: ${{ inputs.authorised_by }}
        run: |
          echo "$REF" | grep -Eq '^[0-9a-f]{12}$' || { echo "::error::session_ref must be 12 lowercase hex characters"; exit 1; }
          [ -n "$AB" ] || { echo "::error::authorised_by is required"; exit 1; }
          b() { printf %s "$1" | base64 -w0; }
          PB="GitHub Actions run $GITHUB_RUN_ID by $GITHUB_ACTOR (Deploy Store server to Fly.io, mode=profile)"
          run() { flyctl ssh console --app "$APP" --command "runuser -u node -- env HCG_STORE_DATA_DIR=/data node --no-warnings server-dist/store-profile.mjs $1" | grep '^{' | tail -1; }
          set_out=$(run "set --session-ref $REF --display-name-b64 $(b "$DN") --designation-b64 $(b "$DS") --authorised-by-b64 $(b "$AB") --performed-by-b64 $(b "$PB")")
          show_out=$(run "show --session-ref $REF")
          { echo "## Store profile"; echo '```json'; echo "$set_out" | jq .; echo "$show_out" | jq .; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$set_out" | jq -e 'has("error") | not' >/dev/null
      # ---- import-release: the files a product's CI built, verified and imported unchanged as a SUBMITTED private
      # draft. Approval and publication stay with a person in HCG Store (separate central permissions). ----
      - name: Import request
        id: imp
        if: inputs.mode == 'import-release'
        env:
          ARGS: ${{ inputs.operator_args }}
        run: |
          REQ=$(jq -r '.request // ""' <<<"$ARGS"); AB=$(jq -r '.authorised_by // ""' <<<"$ARGS"); PR=$(jq -r '.preserved_run // ""' <<<"$ARGS")
          [[ "$REQ" =~ ^[a-z0-9.-]+\.json$ && -f "release-imports/$REQ" ]] || { echo "::error::operator_args.request must name a file in web-hcg-store/release-imports/"; exit 1; }
          [ -n "$AB" ] || { echo "::error::operator_args.authorised_by is required"; exit 1; }
          [[ "$PR" =~ ^[0-9]*$ ]] || { echo "::error::operator_args.preserved_run must be a run ID of this repository's release-import workflow"; exit 1; }
          echo "request=release-imports/$REQ" >> "$GITHUB_OUTPUT"
          FILES=$(jq -r .source.filesArtifact "release-imports/$REQ")
          if [ -n "$PR" ]; then
            # The verified copy the release-import workflow kept (exact bytes); verified again below.
            echo "repo=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"; echo "run=$PR" >> "$GITHUB_OUTPUT"
            echo "files=verified-$FILES" >> "$GITHUB_OUTPUT"; echo "draft=verified-$FILES" >> "$GITHUB_OUTPUT"; echo "preserved=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo=$(jq -r .source.repository "release-imports/$REQ")" >> "$GITHUB_OUTPUT"
            echo "run=$(jq -r .source.runId "release-imports/$REQ")" >> "$GITHUB_OUTPUT"
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
            echo "draft=$(jq -r .source.draftArtifact "release-imports/$REQ")" >> "$GITHUB_OUTPUT"
          fi
      - if: inputs.mode == 'import-release' && steps.imp.outputs.preserved != 'true'
        uses: actions/download-artifact@v4
        with:
          repository: ${{ steps.imp.outputs.repo }}
          run-id: ${{ steps.imp.outputs.run }}
          name: ${{ steps.imp.outputs.files }}
          path: ${{ runner.temp }}/import/files
          github-token: ${{ secrets.HCG_IMPORT_TOKEN || github.token }}
      # The preserved copy holds files/ and draft/ side by side.
      - if: inputs.mode == 'import-release' && steps.imp.outputs.preserved == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.imp.outputs.run }}
          name: ${{ steps.imp.outputs.files }}
          path: ${{ runner.temp }}/import
          github-token: ${{ github.token }}
      - if: inputs.mode == 'import-release' && steps.imp.outputs.preserved != 'true'
        uses: actions/download-artifact@v4
        with:
          repository: ${{ steps.imp.outputs.repo }}
          run-id: ${{ steps.imp.outputs.run }}
          name: ${{ steps.imp.outputs.draft }}
          path: ${{ runner.temp }}/import/draft
          github-token: ${{ secrets.HCG_IMPORT_TOKEN || github.token }}
      - if: inputs.mode == 'import-release'
        uses: actions/checkout@v4
        with:
          repository: F1r3srp3nt/hcg-repo
          ref: 0c25d955fe37accb9c83cde4632637b6dfcd623c
          path: hcg-repo
          sparse-checkout: docs/schemas
      - name: Verify, upload to the Machine and import (no byte changed; nothing approved or published)
        if: inputs.mode == 'import-release'
        env:
          ARGS: ${{ inputs.operator_args }}
          REQUEST: ${{ steps.imp.outputs.request }}
        run: |
          pip install --quiet jsonschema==4.23.0
          python3 scripts/verify-release-import.py --request "$REQUEST" --files "$RUNNER_TEMP/import/files" --draft "$RUNNER_TEMP/import/draft" \
            --schema ../hcg-repo/docs/schemas/release-passport-v1.schema.json --out "$RUNNER_TEMP/import/report.json" | tee -a "$GITHUB_STEP_SUMMARY"
          cp "$REQUEST" "$RUNNER_TEMP/import/request.json"
          NAME="import-$GITHUB_RUN_ID"
          tar -C "$RUNNER_TEMP/import" -czf "$RUNNER_TEMP/$NAME.tar.gz" files draft request.json
          flyctl ssh console --app "$APP" --command "mkdir -p /data/imports"
          printf 'put %s /data/imports/%s.tar.gz\n' "$RUNNER_TEMP/$NAME.tar.gz" "$NAME" | flyctl ssh sftp shell --app "$APP"
          flyctl ssh console --app "$APP" --command "sh -c 'mkdir -p /data/imports/$NAME && tar -xzf /data/imports/$NAME.tar.gz -C /data/imports/$NAME && rm /data/imports/$NAME.tar.gz && chown -R node:node /data/imports/$NAME'"
          b() { printf %s "$1" | base64 -w0; }
          AB=$(jq -r .authorised_by <<<"$ARGS")
          PB="GitHub Actions run $GITHUB_RUN_ID by $GITHUB_ACTOR (Deploy Store server to Fly.io, mode=import-release)"
          out=$(flyctl ssh console --app "$APP" --command "node --no-warnings server-dist/with-machine-env.mjs server-dist/release-import.mjs --dir /data/imports/$NAME --request /data/imports/$NAME/request.json --authorised-by-b64 $(b "$AB") --performed-by-b64 $(b "$PB")" | grep '^{' | tail -1)
          { echo "## Release import"; echo '```json'; echo "$out" | jq .; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$out" | jq -e '.imported == true' >/dev/null
          flyctl ssh console --app "$APP" --command "rm -rf /data/imports/$NAME"
      # ---- free-window: open, extend, terminate or list a free testing window (free-windows.ts) ----
      - name: Free testing window (no price, no payment, no charge)
        if: inputs.mode == 'free-window'
        env:
          ARGS: ${{ inputs.operator_args }}
        run: |
          b() { printf %s "$1" | base64 -w0; }
          j() { jq -r --arg k "$1" '.[$k] // ""' <<<"$ARGS"; }
          CMD=$(j command); safe='^[A-Za-z0-9:._+-]*$'
          for k in product edition release starts ends days id; do [[ "$(j $k)" =~ $safe ]] || { echo "::error::operator_args.$k has unexpected characters"; exit 1; }; done
          [[ "$CMD" =~ ^(open|extend|terminate|list)$ ]] || { echo "::error::operator_args.command must be open, extend, terminate or list"; exit 1; }
          if [ "$CMD" != list ] && [ -z "$(j authorised_by)" ]; then echo "::error::operator_args.authorised_by is required"; exit 1; fi
          PB="GitHub Actions run $GITHUB_RUN_ID by $GITHUB_ACTOR (Deploy Store server to Fly.io, mode=free-window)"
          A="$CMD"
          [ -n "$(j product)" ] && A="$A --product $(j product)"
          [ -n "$(j edition)" ] && A="$A --edition $(j edition)"
          [ -n "$(j release)" ] && A="$A --release $(j release)"
          [ -n "$(j starts)" ] && A="$A --starts $(j starts)"
          [ -n "$(j ends)" ] && A="$A --ends $(j ends)"
          [ -n "$(j days)" ] && A="$A --days $(j days)"
          [ -n "$(j id)" ] && A="$A --id $(j id)"
          A="$A --reason-b64 $(b "$(j reason)") --authorised-by-b64 $(b "$(j authorised_by)") --performed-by-b64 $(b "$PB")"
          out=$(flyctl ssh console --app "$APP" --command "node --no-warnings server-dist/with-machine-env.mjs server-dist/free-window.mjs $A" | grep '^{' | tail -1)
          { echo "## Free testing window"; echo '```json'; echo "$out" | jq .; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$out" | jq -e 'has("error") | not' >/dev/null
      # ---- release-exception: record (or revoke) a founder-operated exception for ONE release and ONE exact set of
      # files (release-exceptions.ts). The account is named by a verified sign-in's 12-hex reference from
      # mode=evidence; no account ID appears here or in the log. ----
      - name: Founder-operated release exception (not an independent review; never a permission)
        if: inputs.mode == 'release-exception'
        env:
          ARGS: ${{ inputs.operator_args }}
        run: |
          b() { printf %s "$1" | base64 -w0; }
          j() { jq -r --arg k "$1" '.[$k] // ""' <<<"$ARGS"; }
          CMD=$(j command)
          [[ "$CMD" =~ ^(grant|revoke|list)$ ]] || { echo "::error::operator_args.command must be grant, revoke or list"; exit 1; }
          [[ "$(j release)" =~ ^(rel-[0-9a-f]{16})?$ ]] || { echo "::error::operator_args.release must be a release ID (rel-…)"; exit 1; }
          [[ "$(j session_ref)" =~ ^([0-9a-f]{12})?$ ]] || { echo "::error::operator_args.session_ref must be 12 lowercase hex characters"; exit 1; }
          [[ "$(j digest)" =~ ^([0-9a-f]{64})?$ ]] || { echo "::error::operator_args.digest must be 64 hex characters"; exit 1; }
          [[ "$(j id)" =~ ^(rx-[0-9a-f]{12})?$ ]] || { echo "::error::operator_args.id must be an exception ID (rx-…)"; exit 1; }
          if [ "$CMD" != list ] && [ -z "$(j authorised_by)" ]; then echo "::error::operator_args.authorised_by is required"; exit 1; fi
          PB="GitHub Actions run $GITHUB_RUN_ID by $GITHUB_ACTOR (Deploy Store server to Fly.io, mode=release-exception)"
          A="$CMD"
          [ -n "$(j release)" ] && A="$A --release $(j release)"
          [ -n "$(j session_ref)" ] && A="$A --session-ref $(j session_ref)"
          [ -n "$(j digest)" ] && A="$A --digest $(j digest)"
          [ -n "$(j id)" ] && A="$A --id $(j id)"
          A="$A --reason-b64 $(b "$(j reason)") --authorised-by-b64 $(b "$(j authorised_by)") --performed-by-b64 $(b "$PB")"
          out=$(flyctl ssh console --app "$APP" --command "node --no-warnings server-dist/with-machine-env.mjs server-dist/release-exception.mjs $A" | grep '^{' | tail -1)
          { echo "## Release exception"; echo '```json'; echo "$out" | jq .; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$out" | jq -e 'has("error") | not' >/dev/null
      - name: Restart the Machine
        if: inputs.mode == 'restart'
        run: flyctl apps restart "$APP"
      - name: Sign-in evidence (no account IDs, tokens or cookies)
        if: inputs.mode == 'evidence'
        run: |
          since='${{ inputs.since_ms }}'
          case "$since" in ''|*[!0-9]*) echo "::error::since_ms must be a number"; exit 1;; esac
          out=$(flyctl ssh console --app "$APP" --command "node --no-warnings server-dist/auth-evidence.mjs --since $since" | grep '^{' | tail -1)
          {
            echo "## Sign-in evidence since $since"
            echo '```json'
            echo "$out" | jq '{events: [.events[] | {at: (.at/1000 | floor | todate), type, session_ref, detail: (.detail | fromjson? // .)}],
                               sessions: [.sessions[] | {session_ref, created_at: (.created_at/1000 | floor | todate), last_seen_at: (.last_seen_at/1000 | floor | todate),
                                          ended_at: (if .ended_at then (.ended_at/1000 | floor | todate) else null end), ended_reason,
                                          refresh_token_deleted, access_token_deleted}]}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report (machines, IPs, certificate, DNS, health)
        if: always()
        run: |
          {
            echo "## HCG Store on Fly.io ($APP)"
            echo '```'
            echo "Apps visible to this token (name, organisation, status):"
            flyctl apps list 2>&1 | head -20 || true
            echo
            flyctl status --app "$APP" 2>&1 | head -12 || true
            echo
            echo "Volumes:"
            flyctl volumes list --app "$APP" 2>&1 || true
            echo
            echo "Secret names (values are never shown):"
            flyctl secrets list --app "$APP" --json 2>/dev/null | jq -r '.[] | (.name // .Name)' || true
            echo
            flyctl machines list --app "$APP" 2>&1 | head -20 || true
            echo
            echo "Machine events (newest first):"
            for m in $(flyctl machines list --app "$APP" --json 2>/dev/null | jq -r '.[].id'); do
              flyctl machine status "$m" --app "$APP" 2>&1 | sed -n '/Event Logs/,$p' | head -25
            done
            echo
            echo "Recent server logs (no tokens are ever logged):"
            # Public log: drop SSH session lines and redact anything that looks like an e-mail address.
            flyctl logs --app "$APP" --no-tail 2>&1 | grep -v -i "ssh session" \
              | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<redacted>/g' | tail -60 || true
            echo
            flyctl ips list --app "$APP" 2>&1 || true
            echo
            flyctl certs show "$DOMAIN" --app "$APP" 2>&1 || echo "No certificate requested for $DOMAIN yet."
            echo
            flyctl certs setup "$DOMAIN" --app "$APP" 2>&1 || true
            echo
            echo "DNS now: $(dig +short CNAME "$DOMAIN" | tr '\n' ' ') $(dig +short A "$DOMAIN" | tr '\n' ' ')"
            echo "DNS detail (public resolver 1.1.1.1):"
            for n in "$DOMAIN" "_acme-challenge.$DOMAIN"; do
              for t in CNAME A AAAA TXT; do
                printf '  %-45s %-5s %s\n' "$n" "$t" "$(dig @1.1.1.1 +short "$t" "$n" | tr '\n' ' ')"
              done
            done
            zone="${DOMAIN#*.}"
            echo "  zone $zone NS:  $(dig @1.1.1.1 +short NS "$zone" | tr '\n' ' ')"
            echo "  status for $DOMAIN: $(dig @1.1.1.1 "$DOMAIN" A | grep -o 'status: [A-Z]*')"
            echo "Authoritative answers (each of the zone's name servers, no recursion):"
            for ns in $(dig @1.1.1.1 +short NS "$zone"); do
              for n in "$DOMAIN" "_acme-challenge.$DOMAIN"; do
                printf '  %-22s %-45s CNAME %s\n' "$ns" "$n" "$(dig @"$ns" +norecurse +short CNAME "$n" | tr '\n' ' ')"
              done
              printf '  %-22s %-45s A     %s\n' "$ns" "$DOMAIN" "$(dig @"$ns" +norecurse +short A "$DOMAIN" | tr '\n' ' ')"
            done
            ns1=$(dig @1.1.1.1 +short NS "$zone" | head -1)
            echo "Zone serial and timing (SOA from $ns1): $(dig @"$ns1" +norecurse +short SOA "$zone")"
            echo "Names a DNS form may have created by mistake (authoritative):"
            for n in "$DOMAIN.$zone" "store.store.$zone" "_acme-challenge.$DOMAIN.$zone" "www.$DOMAIN" "store"; do
              printf '  %-60s %s\n' "$n" "$(dig @"$ns1" +norecurse +short ANY "$n" 2>/dev/null | tr '\n' ' ')$(dig @"$ns1" +norecurse +short CNAME "$n" | tr '\n' ' ')"
            done
            echo "Other public resolvers (A for $DOMAIN): 8.8.8.8 → $(dig @8.8.8.8 +short A "$DOMAIN" | tr '\n' ' ') | 9.9.9.9 → $(dig @9.9.9.9 +short A "$DOMAIN" | tr '\n' ' ')"
            echo "Fly address health: $(curl -s -m 15 https://$APP.fly.dev/api/v1/health || echo unreachable)"
            echo "Domain health:      $(curl -s -m 15 https://$DOMAIN/api/v1/health | head -c 300 || echo unreachable)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
