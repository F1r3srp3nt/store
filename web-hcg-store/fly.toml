# HCG Store on Fly.io: one always-on Machine in Stockholm with a volume for its SQLite database.
# Deploy from this folder (web-hcg-store/) with `fly deploy`. See docs/PRODUCTION-DEPLOY.md.
# Secrets (never in this file): HCG_STORE_SECRET_KEY, set with `fly secrets set`.

app = "hcg-store"
primary_region = "arn"
# Fly sends SIGINT by default; the server stops cleanly on either signal within 8 seconds.
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[env]
  HCG_STORE_MODE = "production"
  HCG_STORE_PUBLIC_ORIGIN = "https://store.hakmicapitalgroup.com"
  HOST = "0.0.0.0"
  PORT = "8080"
  HCG_STORE_DATA_DIR = "/data"
  # Private files (uploads, approved releases) live on the volume, outside the static root (dist/). They are only
  # ever streamed by the server after its checks; nothing here is served as a static file.
  HCG_STORE_ARTIFACT_STORAGE_DIR = "/data/artifacts"
  # Daily consistent copies of the database on the volume (see Backups in docs/PRODUCTION-DEPLOY.md).
  HCG_STORE_BACKUP_DIR = "/data/backups"
  HCG_STORE_BACKUP_KEEP = "14"
  HCG_STORE_STATIC_DIR = "dist"
  HCG_STORE_REPO_ORIGINS = "https://repo.hakmicapitalgroup.com"
  HCG_REPO_BASE_URL = "https://repo.hakmicapitalgroup.com/"
  HCG_ECOSYSTEM_API_URL = "https://beta.hakmicapitalgroup.com/api/public/ecosystem/v1"
  HCG_STORE_ENTITLEMENT_AUTHORITY = "hcg-ecosystem"
  # Off until their own end-to-end tests pass and the founder approves.
  HCG_STORE_PAYMENT_PROVIDER = "none"
  HCG_STORE_PROTECTED_DOWNLOADS = "disabled"
  HCG_STORE_PUBLISHING = "disabled"
  HCG_STORE_UPLOAD_MAX_MB = "2048"

  # Phase 2: HCG Connect sign-in, with HCG Store's dedicated PRODUCTION client (issued by HCG through the Owner
  # workflow: hcg.store / hcg-store-web-production, public, PKCE S256, no secret, status configured_untested).
  # Never the development client: the server refuses it in production.
  HCG_CONNECT_ISSUER = "https://qggdyzoydveafkmjgkpq.supabase.co/auth/v1"
  HCG_CONNECT_AUTHORIZATION_ENDPOINT = "https://qggdyzoydveafkmjgkpq.supabase.co/auth/v1/oauth/authorize"
  HCG_CONNECT_TOKEN_ENDPOINT = "https://qggdyzoydveafkmjgkpq.supabase.co/auth/v1/oauth/token"
  HCG_CONNECT_JWKS_URI = "https://qggdyzoydveafkmjgkpq.supabase.co/auth/v1/.well-known/jwks.json"
  HCG_CONNECT_CLIENT_ID = "94e51fe2-ba09-426d-8b41-8d36bf0dcac5"
  HCG_CONNECT_REDIRECT_URI = "https://store.hakmicapitalgroup.com/auth/callback"
  HCG_CONNECT_SCOPES = "openid email profile"

  # Phase 3: Ship to Store publishing. Separate from customer payments and downloads. Enable only after phase 2 is
  # verified, HCG has created the two permissions below as product features with per-person grants (membership of an
  # organisation alone must not pass), and the publishing checks in docs/PRODUCTION-DEPLOY.md pass. Then set
  # HCG_STORE_PUBLISHING above to "enabled" and uncomment these.
  # HCG Executable Maker's production client (issued by HCG, status configured_untested). Never the Store's own client.
  # HCG_STORE_PUBLISHING_CLIENT_IDS = "fb9b6edf-2bfc-4b5e-a354-dbb1af697029"
  # HCG_STORE_PUBLISHER_CENTRAL_ID = "store.publish"
  # HCG_STORE_RELEASE_APPROVER_CENTRAL_ID = "store.release.approve"

[[mounts]]
  source = "hcg_store_data"
  destination = "/data"
  initial_size = "3gb"
  # Fly's daily volume snapshots, kept 14 days (default 5). Grows by 1 GB at 80 % full, up to 20 GB.
  snapshot_retention = 14
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "20GB"

[http_service]
  internal_port = 8080
  force_https = true
  # One Machine owns the SQLite volume, so it always runs and is never auto-stopped.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/health"

[[restart]]
  policy = "always"
  retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
